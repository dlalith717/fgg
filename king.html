!DOCTYPE html>
<html>
<head>
  <title>MediAI - Healthcare Triage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f9;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      width: 300px;
    }

    h2 {
      text-align: center;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #1e40af;
    }

    .dashboard {
      padding: 20px;
    }

    .logout {
      background: red;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    .risk {
      font-size: 24px;
      font-weight: bold;
      color: red;
    }
  </style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="container">
  <div class="card">
    <h2>MediAI Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage" class="hidden">
  <div class="dashboard">
    <h2>MediAI - Triage Dashboard</h2>
    <p>Patient ID: #4491-X</p>
    <p>Condition: Chest Pain | History: Hypertension</p>
    <p class="risk">AI Risk Level: 94.2%</p>
    <button class="logout" onclick="logout()">Logout</button>
  </div>
</div>

<script>
  // Check if already logged in
  if (localStorage.getItem("auth") === "true") {
    showDashboard();
  }

  function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (email === "admin@mediai.com" && password === "admin123") {
      localStorage.setItem("auth", "true");
      showDashboard();
    } else {
      alert("Invalid credentials");
    }
  }

  function logout() {
    localStorage.removeItem("auth");
    location.reload();
  }

  function showDashboard() {
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("dashboardPage").classList.remove("hidden");
  }
</script>

</body>
</html>
